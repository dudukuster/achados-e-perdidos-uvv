services:
  postgres:
    image: postgres:16-alpine
    container_name: achados_perdidos_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-achados_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-achados_pass}
      POSTGRES_DB: ${POSTGRES_DB:-achados_perdidos}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
